<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8faff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bg-grad)" rx="16"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#312e81" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#312e81" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#312e81" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#312e81" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#312e81" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#312e81" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="280" stroke="#312e81" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="280" stroke="#312e81" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="280" stroke="#312e81" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="280" stroke="#312e81" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="280" stroke="#312e81" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="280" stroke="#312e81" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="280" stroke="#312e81" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="280" stroke="#312e81" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="280" stroke="#312e81" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="280" stroke="#312e81" stroke-width="0.5"/>
    <line x1="1100" y1="0" x2="1100" y2="280" stroke="#312e81" stroke-width="0.5"/>
  </g>

  <!-- Floating node dots (network visual) -->
  <g opacity="0.15">
    <circle cx="60" cy="60" r="3" fill="#4f46e5"/>
    <circle cx="160" cy="100" r="2" fill="#4f46e5"/>
    <circle cx="80" cy="180" r="3" fill="#3b82f6"/>
    <circle cx="1100" cy="80" r="3" fill="#4f46e5"/>
    <circle cx="1040" cy="160" r="2" fill="#3b82f6"/>
    <circle cx="1150" cy="200" r="3" fill="#4f46e5"/>
    <line x1="60" y1="60" x2="160" y2="100" stroke="#4f46e5" stroke-width="0.8"/>
    <line x1="160" y1="100" x2="80" y2="180" stroke="#4f46e5" stroke-width="0.8"/>
    <line x1="1100" y1="80" x2="1040" y2="160" stroke="#4f46e5" stroke-width="0.8"/>
    <line x1="1040" y1="160" x2="1150" y2="200" stroke="#4f46e5" stroke-width="0.8"/>
  </g>

  <!-- Shield Icon -->
  <g transform="translate(148, 60)">
    <!-- Shield body -->
    <path d="M60 8 L108 28 L108 72 Q108 108 60 128 Q12 108 12 72 L12 28 Z"
          fill="url(#shield-grad)" opacity="0.95"/>
    <!-- Shield highlight -->
    <path d="M60 14 L100 31 L100 70 Q100 101 60 120"
          fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
    <!-- Bolt symbol -->
    <path d="M68 42 L52 72 L62 72 L52 98 L76 62 L64 62 Z"
          fill="white" opacity="0.95"/>
  </g>

  <!-- Main Title -->
  <text x="292" y="130" font-family="'Segoe UI', 'SF Pro Display', system-ui, sans-serif"
        font-size="72" font-weight="800" letter-spacing="-2"
        fill="url(#text-grad)">AegisTorrent</text>

  <!-- Tagline -->
  <text x="293" y="170" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="20" font-weight="400" fill="#4338ca" opacity="0.8"
        letter-spacing="0.5">
    Decentralized · Resilient · High-Performance P2P File Distribution
  </text>

  <!-- Pill badges -->
  <!-- Protocol correctness -->
  <rect x="293" y="198" width="178" height="28" rx="14" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="0.8"/>
  <text x="382" y="217" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#4338ca">🔐 Protocol Correct</text>

  <!-- Adaptive scheduling -->
  <rect x="481" y="198" width="172" height="28" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
  <text x="567" y="217" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#15803d">⚡ Adaptive Scheduler</text>

  <!-- Resilient -->
  <rect x="663" y="198" width="148" height="28" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.8"/>
  <text x="737" y="217" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#92400e">🌐 NAT Resilient</text>

  <!-- Observability -->
  <rect x="821" y="198" width="168" height="28" rx="14" fill="#fce7f3" stroke="#f9a8d4" stroke-width="0.8"/>
  <text x="905" y="217" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#9d174d">📊 Observability-First</text>

  <!-- Bottom border accent -->
  <rect x="0" y="274" width="1200" height="6" rx="0 0 16 16" fill="url(#shield-grad)" opacity="0.6"/>
</svg>
